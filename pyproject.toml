[project]
name = "compression-hackathon-solutions"
version = "0.1.0"
description = "Reproducible solutions for the ESiWACE3 / ECMWF compression lab challenges"
readme = "README.md"
requires-python = ">=3.14"
license = "CC-BY-4.0"
# versions pinned to match climet-eu/compression-lab-notebooks so that the
# codec configs behave identically to the online laboratory
dependencies = [
    "aiohttp==3.14.3",
    "cfgrib==0.9.15.1",
    "compression-recommendations==0.1.0a1",
    "compression-requirement-checks==0.1.0a1",
    "compression-requirement-safeguards==0.1.0a1",
    "compression-safeguards==1.0.0rc3",
    "h5netcdf==1.8.1",
    "h5py==3.16.0",
    "kerchunk==0.2.10",
    "matplotlib==3.10.8",
    "numcodecs==0.15.1",
    "numcodecs-combinators==0.2.15",
    "numcodecs-mask==0.1.0",
    "numcodecs-pw-ratio==0.2.1",
    "numcodecs-replace==0.1.3",
    "numcodecs-safeguards==0.1.0rc3",
    "numcodecs-tokenize==0.1.3",
    "numcodecs-wasm==0.2.5",
    "numcodecs-wasm-bit-round==0.5.0",
    "numcodecs-wasm-ebcc==0.3.1a0",
    "numcodecs-wasm-lc==0.1.0",
    "numcodecs-wasm-round==0.5.0",
    "numcodecs-wasm-sperr==0.2.3",
    "numcodecs-wasm-sz3==0.8.4",
    "numcodecs-wasm-zfp==0.6.0",
    "numcodecs-wasm-zstd==0.4.0",
    "numcodecs-zero==0.1.2",
    "pandas==2.3.3",
    "requests==2.34.2",
    "s3fs==2026.7.0",
    "xarray==2026.7.0",
    "zarr==3.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/hackathon"]

[tool.ruff.lint]
ignore = ["F401"]
